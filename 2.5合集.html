<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>11.19🍉合集</title>
  <link href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/tcplayer.min.css" rel="stylesheet" />
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/libs/hls.min.0.13.2m.js"></script>
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.5.0/tcplayer.v4.5.0.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #e0f7ff, #ffffff);
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #111;
      margin-bottom: 30px;
    }

    .video-block {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 15px;
      margin-bottom: 30px;
    }

    .video-title {
      display: block;
      background: #0094ff;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      text-align: left; /* 修改为靠左对齐 */
    }

    .video-title:hover {
      background: #0079cc;
    }

    .tcplayer-container {
      display: none;
      width: 100%;
      height: 580px;
      max-width: 1080px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }

    .jump-btn {
      display: none;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #ff6a00;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .jump-btn:hover {
      background-color: #e85c00;
    }
  </style>
</head>
<body>
  <h1>2.5🍉合集</h1>
  <div id="content">加载中...</div>

  <script>
    const players = [];
    let currentPlayingIndex = null;

    function getLocalData() {
      return {
        data_mp4: [
          { title: "吃🍉快手 #抖音 #走光 #闪现", url: "http://aod.cos.tx.xmcdn.com/storages/1264-audiofreehighqps/BE/7B/GAqh4zINWcx7ACAAAARl9veN.mp4" },
          { title: "吃🍉 夜场有好女孩么？", url: "http://aod.cos.tx.xmcdn.com/storages/78f8-audiofreehighqps/79/95/GAqhntANWcz4ABzWYwRl9zh-.mp4" },
          { title: "吃🍉 道反天罡啊，本来想来按摩放松的，结果被技师干了.", url: "http://aod.cos.tx.xmcdn.com/storages/bcd2-audiofreehighqps/5B/0D/GKwRIaINWc1OAB_ykwRl92wW.mp4" },
          { title: "吃🍉这个厉害，小日子真会玩", url: "http://aod.cos.tx.xmcdn.com/storages/ad25-audiofreehighqps/FC/97/GKwRIJINWc2mABZmTQRl95rb.mp4" },
          { title: "吃🍉眼镜妹 摸你🐔🎱 ", url: "http://aod.cos.tx.xmcdn.com/storages/b2db-audiofreehighqps/B0/22/GAqh_aQNWc4KACAAAARl99Yt.mp4" },
          { title: "吃🍉小烧鸡，求地址！", url: "http://aod.cos.tx.xmcdn.com/storages/8072-audiofreehighqps/B6/40/GKwRIW4NWc5TACAAAARl-ATv.mp4" },
          { title: "吃🍉 哈尼 太饥渴了，想闻闻滋滋臭13。", url: "http://aod.cos.tx.xmcdn.com/storages/7f6e-audiofreehighqps/7A/54/GAqhp50NWc8AACAAAARl-HnO.mp4" },
          { title: "吃🍉声音小点！", url: "http://aod.cos.tx.xmcdn.com/storages/1963-audiofreehighqps/63/17/GAqh_aQNWc9oAA3wfQRl-Lg-.mp4" },
          { title: "吃🍉干啥呢这是", url: "http://aod.cos.tx.xmcdn.com/storages/44e0-audiofreehighqps/36/44/GAqh_aQNWc_qACAAAARl-Pwj.mp4" },
          { title: "吃🍉饥渴群友，到处扒人家裤头 ", url: "http://aod.cos.tx.xmcdn.com/storages/b67c-audiofreehighqps/81/2D/GKwRIRwNWdDBACAAAARl-Yt3.mp4" },
        ],
        btn_text: '加入吃瓜微信群',
        btn_link: 'https://mp.weixin.qq.com/s/vUGpJ_loc38t4zkAd8Sbdg',
        title: '转发＝更新的动力'
      };
    }

    async function loadVideos() {
      const data = getLocalData();
      document.title = data.title;

      const container = document.getElementById('content');
      container.innerHTML = '';

      data.data_mp4.forEach((item, index) => {
        const videoId = "tcplayer-container-" + index;
        const block = document.createElement('div');
        block.className = 'video-block';
        block.innerHTML = `
          <span class="video-title" data-index="${index}">${index + 1}. ${item.title}</span>
          <video id="${videoId}" class="tcplayer-container" preload="auto" playsinline webkit-playsinline></video>
          <button class="jump-btn">${data.btn_text}</button>
        `;
        container.appendChild(block);

        const jumpBtn = block.querySelector('.jump-btn');
        jumpBtn.onclick = () => window.location.href = data.btn_link;

        setTimeout(() => {
          const player = TCPlayer(videoId, { reportable: false });
          player.src(item.url);
          player.pause();
          players[index] = player;
        }, 0);
      });

      document.querySelectorAll('.video-title').forEach(titleElem => {
        titleElem.addEventListener('click', function () {
          const index = parseInt(this.getAttribute('data-index'));
          if (currentPlayingIndex === index) return;

          if (currentPlayingIndex !== null) {
            const prevVideoElem = document.getElementById("tcplayer-container-" + currentPlayingIndex);
            if (prevVideoElem) prevVideoElem.style.display = 'none';
            const prevBlock = prevVideoElem?.parentElement;
            prevBlock?.querySelector('.jump-btn')?.style.setProperty('display', 'none');
            players[currentPlayingIndex]?.pause();
          }

          const currentVideoElem = document.getElementById("tcplayer-container-" + index);
          currentVideoElem.style.display = 'block';
          const currentBlock = this.parentElement;
          currentBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
          currentBlock.querySelector('.jump-btn').style.display = 'block';
          players[index]?.play();
          currentPlayingIndex = index;
        });
      });
    }

    loadVideos();
  </script>
</body>
</html>
